args:
- default: true
  description: War Room entryID of the file to read.
  name: entryID
  required: true
- description: Maximal file size to load, in bytes. Default is 1MB.
  name: maxFileSize
- auto: PREDEFINED
  description: The character encoding of the file.
  name: input_encoding
  predefined:
  - binary
  - utf-8
  - utf-16
  - ascii
  - gbk
- auto: PREDEFINED
  defaultValue: raw
  description: The data type to which the output data is converted.
  name: output_data_type
  predefined:
  - raw
  - base64
  - json
- auto: PREDEFINED
  defaultValue: "false"
  description: Set true in order to output additional metadata on the file, to context.
  name: output_metadata
  predefined:
  - "true"
  - "false"
comment: Load the contents of a file into context.
commonfields:
  id: ReadFile
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 5.0.0
    itemVersion: 1.22.58
    packID: CommonScripts
    packName: Common Scripts
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    toServerVersion: ""
dockerimage: demisto/python3:3.12.13.10404775
enabled: true
engineinfo: {}
mainengineinfo: {}
name: ReadFile
outputs:
- contextPath: FileData
  description: Data read from the War Room file.
  type: Unknown
- contextPath: ReadFile.Data
  description: Data read from the War Room file.
  type: Unknown
- contextPath: ReadFile.EntryID
  description: File entry ID.
  type: string
- contextPath: ReadFile.FileSize
  description: File size.
  type: number
- contextPath: ReadFile.EOF
  description: Whether the file has reached end-of-file.
  type: boolean
pswd: ""
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('ReadFile', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.22.58'
  demisto.debug('pack id = CommonScripts, pack version = 1.22.58')
  import base64
  import os







  def read_file(args):
      max_file_size = demisto.get(args, "maxFileSize")
      if max_file_size:
          max_file_size = int(max_file_size)
      else:
          max_file_size = 1024**2

      entry_id = args.get("entryID")
      input_encoding = args.get("input_encoding", "utf-8")
      output_data_type = args.get("output_data_type", "raw")
      output_metadata = argToBoolean(args.get("output_metadata", "false"))

      file_path = execute_command("getFilePath", {"id": entry_id})["path"]
      file_size = os.path.getsize(file_path)

      try:
          # always reading in bytes mode
          with open(file_path, "rb") as f:
              raw = f.read(max_file_size)
              eof = len(f.read(1)) == 0
      except Exception as e:
          raise DemistoException(f"There was a problem opening or reading the file.\nError is: {e}")

      if not output_metadata and len(raw) == 0:
          raise DemistoException("No data could be read.")

      message = f"Read {len(raw)} bytes from file"

      # then decoding the raw data
      if input_encoding == "binary":
          data = raw
      else:
          try:
              data = raw.decode(input_encoding)  # type: ignore[assignment]
          except UnicodeDecodeError as e:
              # ---- extract bad bytes ----
              bad_bytes = raw[e.start : e.end]
              bad_hex = bad_bytes.hex()
              bad_repr = repr(bad_bytes)

              demisto.info(
                  f"Warning: failed to decode bytes at positions {e.start}-{e.end} using encoding '{input_encoding}'."
                  f" Bytes (hex)={bad_hex}, repr={bad_repr} for file: {file_path}"
              )

              data = raw.decode(input_encoding, errors="replace")  # type: ignore[assignment]

      # output handling
      if output_data_type == "raw":
          if isinstance(data, bytes):
              data = data.decode("utf-8", errors="replace")  # type: ignore[assignment]

      elif output_data_type == "base64":
          if isinstance(data, str):
              data = data.encode(input_encoding or "utf-8")
          data = base64.b64encode(data).decode()  # type: ignore[assignment]

      elif output_data_type == "json":
          if isinstance(data, bytes):
              data = data.decode("utf-8", errors="replace")  # type: ignore[assignment]
          data = json.loads(data)

      else:
          raise DemistoException(f"Invalid data encoding name: {output_data_type}")

      if output_metadata:
          return_results(
              CommandResults(
                  outputs_prefix="ReadFile(obj.EntryID===val.EntryID)",
                  outputs={"Data": data, "EntryID": entry_id, "FileSize": file_size, "EOF": eof},
                  readable_output=message + ":\n" + str(data),
              )
          )
      else:
          demisto.results(
              {
                  "Type": entryTypes["note"],
                  "ContentsFormat": formats["text"],
                  "Contents": {"FileData": data},
                  "HumanReadable": message + ":\n" + str(data),
                  "EntryContext": {"FileData": data},
              }
          )


  def main():
      try:
          read_file(demisto.args())
      except Exception as e:
          return_error(f"Failed to run script - {e}")


  if __name__ in ["__main__", "builtin", "builtins"]:
      main()

  register_module_line('ReadFile', 'end', __line__())
