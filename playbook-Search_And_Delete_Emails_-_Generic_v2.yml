description: 'This playbook searches and deletes emails with similar attributes of
  a malicious email using one of the following integrations: * EWS * Microsoft Graph
  Security * Gmail * Agari Phishing Defense.'
id: Search And Delete Emails - Generic v2
inputSections:
- description: Generic group for inputs
  inputs:
  - From
  - Subject
  - AttachmentName
  - SearchAndDeleteIntegration
  - SearchThisWeek
  - MsgCase
  - MsgKQL
  - MsgRecipients
  - MsgMailboxScope
  - MsgDeleteType
  - MsgMailboxExclusion
  name: General (Inputs group)
inputs:
- description: The value of the malicious email's "From" attribute.
  key: From
  playbookInputQuery: null
  required: false
  value:
    complex:
      accessor: emailfrom
      root: incident
- description: The value of the malicious email's "Subject" attribute.
  key: Subject
  playbookInputQuery: null
  required: false
  value:
    complex:
      accessor: emailsubject
      root: incident
- description: The value of the malicious email's "AttachmentName" attribute.
  key: AttachmentName
  playbookInputQuery: null
  required: false
  value:
    complex:
      accessor: attachmentname
      root: incident
- description: The integration in which to run the search and delete action. Can be
    MS Graph, Gmail, EWS, or Agari Phishing Defense.
  key: SearchAndDeleteIntegration
  playbookInputQuery: null
  required: true
  value: {}
- description: Whether to limit the search to the current week. Disabling this may
    increase search scope, execution time, and risk of timeout for large mailboxes.
  key: SearchThisWeek
  playbookInputQuery: null
  required: false
  value:
    simple: "true"
- description: Used only with Microsoft Graph Security. The eDiscovery case name to
    use. Looked up by name and created if missing.
  key: MsgCase
  playbookInputQuery: null
  required: false
  value:
    simple: XSOAR Auto Phishing
- description: Used only with Microsoft Graph Security. KQL query identifying the
    emails to search and delete. Built automatically from the From, Subject, and AttachmentName
    inputs if left empty.
  key: MsgKQL
  playbookInputQuery: null
  required: false
  value: {}
- description: Used only with Microsoft Graph Security. CSV of recipient email addresses
    to scope the search when MsgMailboxScope is recipientsOnly.
  key: MsgRecipients
  playbookInputQuery: null
  required: false
  value:
    complex:
      accessor: emailto
      root: incident
- description: Used only with Microsoft Graph Security. Determines which mailboxes
    to search. Use recipientsOnly to limit to specific recipients, allTenantMailboxes
    to search the entire tenant.
  key: MsgMailboxScope
  playbookInputQuery: null
  required: false
  value: {}
- description: Used only with Microsoft Graph Security. The delete type to perform
    on the search results. Possible values are Hard or Soft, or leave empty to select
    manually (Hard = unrecoverable, Soft = recoverable).
  key: MsgDeleteType
  playbookInputQuery: null
  required: false
  value: {}
- description: 'Used only with Microsoft Graph Security. CSV of mailboxes to exclude
    from the search. Honored only when MsgMailboxScope is allTenantMailboxes. Note:
    exclusion works at the message level, not the mailbox level — see subplaybook
    description for details.'
  key: MsgMailboxExclusion
  playbookInputQuery: null
  required: false
  value: {}
name: Search And Delete Emails - Generic v2
outputSections:
- description: Generic group for outputs
  name: General (Outputs group)
  outputs: []
