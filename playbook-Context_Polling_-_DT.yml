description: This playbook polls a context value until a specific condition, defined
  by a DT expression, is met.
id: Context Polling - DT
inputSections:
- description: Generic group for inputs
  inputs:
  - value_dt
  - eval_dt
  - playbook_id
  - frequency
  - timeout
  - tags
  - extract_mode
  name: General (Inputs group)
inputs:
- description: The DT expression for retrieving a value from the context data.
  key: value_dt
  playbookInputQuery: null
  required: true
  value: {}
- description: The DT expression for retrieving data for the evaluation from the data
    returned by `value_dt`.
  key: eval_dt
  playbookInputQuery: null
  required: false
  value: {}
- description: The sub-playbook ID for retrieving its local context from the context
    data. Use ${currentPlaybookID} to specify the current sub-playbook ID.
  key: playbook_id
  playbookInputQuery: null
  required: false
  value: {}
- description: How often to check (in minutes).
  key: frequency
  playbookInputQuery: null
  required: true
  value:
    simple: "1"
- description: When to timeout (in minutes).
  key: timeout
  playbookInputQuery: null
  required: true
  value:
    simple: "10"
- description: Tags of waiting tasks to be completed upon polling completion.
  key: tags
  playbookInputQuery: null
  required: false
  value: {}
- description: Indicator Extraction mode for the command sequence. (In XSOAR 8 and
    above, for first run command set manually the RunPollingCommand task in the playbook,
    Advanced -> Indicator Extraction mode).
  key: extract_mode
  playbookInputQuery: null
  required: false
  value: {}
name: Context Polling - DT
outputSections:
- description: Generic group for outputs
  name: General (Outputs group)
  outputs: []
outputs: []
starttaskid: "0"
system: true
tasks:
  "0":
    continueonerrortype: ""
    id: "0"
    ignoreworker: false
    isautoswitchedtoquietmode: false
    isoversize: false
    nexttasks:
      '#none#':
      - "1"
    note: false
