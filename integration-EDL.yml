description: Use the Generic Export Indicators Service integration to provide an endpoint
  with a list of indicators as a service for the system indicators.
detaileddescription: "## Generic Export Indicators Service\n\nIf you have several
  Generic Export Indicators Service integration instances, make sure to use **different
  listening ports** to separate the outbound feeds.\nEach instance uses three consecutive
  ports: the configured **Listen Port**, port + 1, and port + 2. NGINX listens on
  the configured port (public), the Python process listens on port + 1, and NGINX
  uses port + 2 internally for its fail-fast cache fetch tier. For example, if configured
  for port 9009, ports 9009, 9010, and 9011 must all be free. Ensure no other instance
  uses a **Listen Port** within 2 of another. When running without `--network=host`,
  ports + 1 and + 2 are not exposed to the machine.\n\nThe Generic Export Indicators
  Service is a long-running integration. For more information about long-running integrations,
  check out the  \n\n\n\n\n\n\n\n### Access the Generic Export Indicators Service
  by URL and Port (HTTP)\nIn a web browser, go to **http://<cortex-xsoar-server-address>:<listen_port>**.\n\n**Note**:
  For security purposes, Cortex XSOAR recommends that you use HTTPS when accessing
  the indicator service through the URL and port. To do so, you must provide a certificate
  and private key, in the respective fields. In addition, make sure to provide credentials
  that must be used to connect to the integration instance.\n\n**Note**: By default,
  the route to access the Generic Export Indicators Service by instance name will
  be open without security hardening and might expose you to network risks. Cortex
  XSOAR recommends that you use the service with a username and password. Click **Switch
  to username and password** and provide the credentials that must be used to access
  the service.\n\n**Note**: The `Listen Port` parameter is required.\n\n1. Navigate
  to **Settings > About > Troubleshooting**.\n2. In the **Server Configuration** section,
  verify that the `instance.execute.external.<instance_name>` key is set to `true`.
  If this key does not exist, click **+ Add Server Configuration** and add the `instance.execute.external.<instance_name>`
  and set the value to `true`. See [this documentation](https://xsoar.pan.dev/docs/reference/articles/long-running-invoke)
  for further information.\n3.  In a web browser, go to\n    `https://*<xsoar_address>*/instance/execute/*<instance_name>*`\n
  \    (In Multi Tenant environments, go to `https://<cortex-xsoar-address>/acc-<account
  name>/instance/execute/<instance_name>/`)\n\n\n\n\n#### Note:\nWhen using more than
  one server in High Availability (HA) mode, the External Dynamic List (EDL) should
  be configured to listen on a route, not on a port.\n\nIn \"route\" listen mode,
  a request received by any of the app servers will be redirected to the one currently
  running the NGINX container.\nThis does not happen in \"port\" listen mode, that's
  why \"route\" mode should be used.\n\nIf the app server running the container fails,
  the container should restart on a different app server.\nFailover time should be
  about 1 minute plus the container startup time.\n\n### Modify Request Parameters
  Through the URL\nUse the following arguments in the URL to change the request:\n\n|
  argument | Description | Example |\n| --- | --- | --- |\n| **n** | The maximum number
  of entries in the output. If no value is provided, will use the value specified
  in the *List Size* parameter configured in the instance configuration. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?n=50
  |\n| **s** | The starting entry index from which to export the indicators when index
  0 is the first position. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?s=10&n=50
  |\n| **v** | The output format. Supports `PAN-OS (text)`, `CSV`, `JSON`, `mwg` and
  `proxysg` (alias: `bluecoat`). | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=json
  |\n| **q** | The query used to retrieve indicators from the system. If you are using
  this argument, no more than 100,000 can be exported through the EDL. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?q=\"type:ip
  and sourceBrand:my_source\" |\n| **t** | Only with `mwg` format. The type indicated
  on the top of the exported list. Supports: string, applcontrol, dimension, category,
  ip, mediatype, number and regex. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=mwg&t=ip
  |\n| **sp** | If set. will strip ports off URLs, otherwise will ignore URLs with
  ports. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=text&sp
  |\n| **di** | Only with `PAN-OS (text)` format. If set, will ignore URLs which are
  not compliant with PAN-OS URL format instead of being re-written. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=text&di
  |\n| **pr** | If set, will strip protocols off URLs.| https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=text&pr
  |\n|**cd** | Only with `proxysg` format. The default category for the exported indicators.
  | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=proxysg&cd=default_category
  |\n| **ca** | Only with `proxysg` format. The categories which will be exported.
  Indicators not in these categories will be classified as the default category. |
  https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=proxysg&ca=category1,category2
  |\n| **tr** | Only with `PAN-OS (text)` format. Whether to collapse IPs.<br/>* 0
  - Do not collapse.<br/>* 1 - Collapse to ranges.<br/>* 2 - Collapse to CIDRs. |
  https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?q=\"type:ip
  and sourceBrand:my_source\"&tr=1 |\n| **tx** | Whether to output `CSV` formats as
  textual web pages. | https://{cortex-xsoar_instance}/instance/execute/{ExportIndicators_instance_name}?v=csv&tx
  |\n\n### When Running in On-Demand Mode\nMake sure you run the ***!export-indicators-list-update***
  command for the first time to initialize the export process.\n\n### Important Notes:\n-
  If you frequently use different queries for the same EDL instance through the *q*
  inline argument, use separate EDL instances (one per query) and set a default query
  for each to improve performance.\n- When using the *q* inline argument, the number
  of exported indicators is limited to 100,000 for performance reasons. To export
  more than 100,000 indicators, create a new integration instance with the desired
  Indicator Query and List Size.\n- When the integration is configured with ***Update
  list on demand only***, the indicator list refreshes based on the value set in the
  ***Refresh Rate*** parameter.\n\n## Troubleshoot\n\nTo view logs concerning the
  creation of the indicator list and its current status add the `/log` suffix to the
  list URL.\n\n\n\n`https://*<xsoar_address>*/instance/execute/*<instance_name>*/log`\n\n\n\n---\n[View
  Integration Documentation](https://xsoar.pan.dev/docs/reference/integrations/edl)"
