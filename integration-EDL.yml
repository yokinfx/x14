configuration:
- additionalinfo: Enabling this prevents automatic list refresh.
  advanced: true
  display: Update list on demand only
  name: on_demand
  required: false
  section: Collect
  type: 8
- additionalinfo: The query to run to update the indicators list. To view expected
    results, run the following command from the Cortex XSOAR CLI `!findIndicators
    query=<your query>`. An empty value may load unwanted indicators. See integration
    docs for troubleshooting information.
  display: Indicator Query
  name: indicators_query
  required: false
  section: Collect
  type: 0
- additionalinfo: The format of the exported list.
  advanced: true
  defaultvalue: PAN-OS (text)
  display: Outbound Format
  name: format
  options:
  - PAN-OS (text)
  - CSV
  - JSON
  - McAfee Web Gateway
  - Symantec ProxySG
  required: false
  section: Collect
  type: 15
- additionalinfo: For use with JSON and CSV formats - select specific XSOAR fields
    to export (comma separated list). If given the value 'all' - all XSOAR fields
