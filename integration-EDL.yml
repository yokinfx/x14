  dockerimage: demisto/flask-nginx:1.0.0.12826098
  longRunning: true
  longRunningPort: true
  runonce: false
  script: |
    register_module_line('EDL', 'start', __line__())
    CONSTANT_PACK_VERSION = '3.4.4'
    demisto.debug('pack id = EDL, pack version = 3.4.4')
    import errno
    import glob
    import hashlib
    import ipaddress
    import os
    import re
    import socket
    import tempfile
    import uuid
    import zipfile
    from base64 import b64decode
    from collections.abc import Callable, Iterable
    from datetime import datetime
    from enum import Enum
    from math import ceil
    from pathlib import Path
    from typing import IO


    import tldextract
    import urllib3

    from flask import Flask, Response, request, send_file
    from netaddr import IPNetwork, IPRange, IPSet

    # Disable insecure warnings
    urllib3.disable_warnings()

    """ GLOBAL VARIABLES """
    INTEGRATION_NAME: str = "Generic Export Indicators service"
    PAGE_SIZE: int = 2000
    PAN_OS_MAX_URL_LEN = 255
    APP: Flask = Flask("demisto-edl")
    EDL_LIMIT_ERR_MSG: str = "Please provide a valid integer for List Size"
