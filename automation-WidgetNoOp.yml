comment: A no-op placeholder script used by visual-only widgets (e.g. Page Break,
  Text Widget) that require a script dataType but do not need to query any data source.
  Returns a mock result to prevent unnecessary database queries.
commonfields:
  id: WidgetNoOp
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 6.1.0
    itemVersion: 1.3.5
    packID: CommonWidgets
    packName: Common Widgets
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    toServerVersion: ""
dockerimage: demisto/python3:3.12.13.10404775
engineinfo: {}
mainengineinfo: {}
name: WidgetNoOp
pswd: ""
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('WidgetNoOp', 'start', __line__())
  CONSTANT_PACK_VERSION = '1.3.5'
  demisto.debug('pack id = CommonWidgets, pack version = 1.3.5')




  def main() -> None:
      groups = [{"name": "", "data": [], "color": "", "groups": []}]
      demisto.results({"Type": 1, "ContentsFormat": "json", "Contents": json.dumps(groups)})


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('WidgetNoOp', 'end', __line__())
scripttarget: 0
